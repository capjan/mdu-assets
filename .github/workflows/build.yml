name: Build
on:
  pull_request:
    paths:
      - 'Source/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps the NetVips Native AOT spike green, so library updates that break AOT or AVIF show up early.
  netvips-aot-spike:
    name: NetVips AOT spike (${{ matrix.rid }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Source/Spikes/NetVipsAot
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/Spikes/NetVipsAot/global.json

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      run: >-
        dotnet publish NetVipsAot.csproj --configuration Release --runtime ${{ matrix.rid }}
        -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/spike"

    - name: Run spike checks
      run: '"$RUNNER_TEMP/spike/NetVipsAot"'

name: Build
on:
  pull_request:
    paths:
      - 'Source/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (${{ matrix.rid }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Source
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/global.json

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Test
      run: dotnet test --solution MduAssets.slnx --configuration Release

    - name: Publish Native AOT executable
      run: >-
        dotnet publish MduAssets/MduAssets.csproj --configuration Release --runtime ${{ matrix.rid }}
        -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/server"

    - name: Smoke test the native server
      env:
        MDU_ASSETS_DATADIRECTORY: ${{ runner.temp }}/data
        ASPNETCORE_HTTP_PORTS: 8080
      run: |
        "$RUNNER_TEMP/server/mdu-assets" &
        pid=$!
        for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
        curl -sf http://127.0.0.1:8080/healthz
        kill $pid
        test -f "$MDU_ASSETS_DATADIRECTORY/mdu-assets.db"

  docker:
    name: Docker (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build image
      run: docker build --tag mdu-assets:ci Source

    - name: Smoke test the container
      run: |
        docker run --detach --name mdu-assets --publish 127.0.0.1:8080:8080 mdu-assets:ci
        for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
        curl -sf http://127.0.0.1:8080/healthz
        test "$(docker inspect --format '{{.Config.User}}' mdu-assets)" = app
        docker logs mdu-assets
        docker rm --force mdu-assets

  # Keeps the NetVips Native AOT spike green, so library updates that break AOT or AVIF show up early.
  netvips-aot-spike:
    name: NetVips AOT spike (${{ matrix.rid }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Source/Spikes/NetVipsAot
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/Spikes/NetVipsAot/global.json

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      run: >-
        dotnet publish NetVipsAot.csproj --configuration Release --runtime ${{ matrix.rid }}
        -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/spike"

    - name: Run spike checks
      run: '"$RUNNER_TEMP/spike/NetVipsAot"'

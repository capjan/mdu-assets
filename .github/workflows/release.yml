name: Release

# Started manually from main. git-cliff calculates the version from the Conventional Commits since the last v* tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: capjan/mdu-assets

jobs:
  prepare-release:
    name: Calculate release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Validate signing and publishing configuration
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_NOTARIZATION_KEY" || -z "$APPLE_NOTARIZATION_KEY_ID" || -z "$APPLE_NOTARIZATION_ISSUER_ID" ]]; then
          echo "::error::Configure the Apple signing and notarization secrets and variables described in AGENTS.md."
          exit 1
        fi
        if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
          echo "::error::Configure the Docker Hub secrets described in AGENTS.md."
          exit 1
        fi
        status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/$IMAGE/")"
        if [[ "$status" != 200 ]]; then
          echo "::error::Docker Hub repository $IMAGE is missing or not public (HTTP $status). Create it as a public repository, as described in AGENTS.md."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install git-cliff
      uses: taiki-e/install-action@v2
      with:
        tool: git-cliff@2.14.2

    - name: Calculate release version
      id: version
      run: |
        latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
        release_tag="$(git cliff --config Source/cliff.toml --bumped-version)"
        if [[ -n "$latest_tag" && "$release_tag" == "$latest_tag" ]]; then
          echo "::error::No release-worthy Conventional Commits after $latest_tag."
          exit 1
        fi
        {
          echo "latest_tag=$latest_tag"
          echo "tag=$release_tag"
          echo "version=${release_tag#v}"
        } >> "$GITHUB_OUTPUT"
        echo "Previous tag: ${latest_tag:-none}"
        echo "Release tag: $release_tag"

    - name: Generate release notes
      env:
        LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        # Without a previous tag (first release) git-cliff takes the whole history.
        set -- --config Source/cliff.toml --tag "$RELEASE_TAG" --strip all --output "$RUNNER_TEMP/release-notes.md"
        if [[ -n "$LATEST_TAG" ]]; then set -- "$@" "$LATEST_TAG..HEAD"; fi
        git cliff "$@"
        cat "$RUNNER_TEMP/release-notes.md"

    - name: Upload release notes
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes.md
        if-no-files-found: error

  test:
    name: Test
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Source
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/global.json

    - name: Test
      run: dotnet test --solution MduAssets.slnx --configuration Release

  build-native:
    name: Native archive (${{ matrix.rid }})
    needs: [prepare-release, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu runners keep the glibc requirement of the binaries low.
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE_NAME: mdu-assets-${{ needs.prepare-release.outputs.version }}-${{ matrix.rid }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/global.json

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
        RID: ${{ matrix.rid }}
      run: >-
        dotnet publish Source/MduAssets/MduAssets.csproj --configuration Release --runtime "$RID"
        -warnaserror:IL2026,IL2104,IL3050,IL3053 -p:Version="$VERSION"
        --output "$RUNNER_TEMP/publish"

    # The program needs its native libraries (libvips, libe_sqlite3) next to it, so the archive holds a folder.
    - name: Prepare archive contents
      env:
        RID: ${{ matrix.rid }}
      run: |
        contents="$RUNNER_TEMP/archive/$ARCHIVE_NAME"
        mkdir -p "$contents"
        rsync -a --exclude '*.pdb' --exclude '*.dbg' --exclude '*.dSYM' "$RUNNER_TEMP/publish/" "$contents/"
        cp README.md LICENSE Source/THIRD-PARTY-NOTICES.md "$contents/"
        cp -R Source/Licenses "$contents/licenses"
        notices=("$HOME"/.nuget/packages/netvips.native."$RID"/*/THIRD-PARTY-NOTICES.md)
        if [[ ${#notices[@]} -ne 1 || ! -f "${notices[0]}" ]]; then
          echo "::error::Expected one libvips THIRD-PARTY-NOTICES.md for $RID, found: ${notices[*]}"
          exit 1
        fi
        cp "${notices[0]}" "$contents/licenses/libvips-THIRD-PARTY-NOTICES.md"
        ls -la "$contents" "$contents/licenses"

    - name: Import Developer ID Application certificate
      if: runner.os == 'macOS'
      id: signing-certificate
      uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7
      with:
        p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

    - name: Sign macOS program and libraries
      if: runner.os == 'macOS'
      env:
        IDENTITIES: ${{ steps.signing-certificate.outputs.identities }}
      run: |
        identity_hash=$(jq -r 'first(.[] | select(.name | startswith("Developer ID Application:")) | .hash) // empty' <<< "$IDENTITIES")
        if [[ -z "$identity_hash" ]]; then
          echo "::error::No valid Developer ID Application identity was imported."
          exit 1
        fi
        contents="$RUNNER_TEMP/archive/$ARCHIVE_NAME"
        # Libraries first, the program last.
        find "$contents" -name '*.dylib' -print0 | while IFS= read -r -d '' library; do
          codesign --force --options runtime --timestamp --sign "$identity_hash" "$library"
          codesign --verify --strict --verbose=2 "$library"
        done
        codesign --force --options runtime --timestamp --sign "$identity_hash" "$contents/mdu-assets"
        codesign --verify --strict --verbose=2 "$contents/mdu-assets"

    - name: Prepare macOS notarization archive
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent "$RUNNER_TEMP/archive/$ARCHIVE_NAME" "$RUNNER_TEMP/notarization.zip"

    - name: Notarize macOS program and libraries
      if: runner.os == 'macOS'
      uses: Apple-Actions/notarize@4c7a9c62eed74953bcc47900228429c8e31aa05c # v1
      with:
        path: ${{ runner.temp }}/notarization.zip
        issuer-id: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
        api-key-id: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
        api-private-key: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
        staple: false

    - name: Create archive
      run: tar -czf "$RUNNER_TEMP/$ARCHIVE_NAME.tar.gz" -C "$RUNNER_TEMP/archive" "$ARCHIVE_NAME"

    - name: Smoke test the archived server
      env:
        MDU_ASSETS_DATADIRECTORY: ${{ runner.temp }}/data
        MDU_ASSETS_UIBASEURL: http://127.0.0.1:8080
        MDU_ASSETS_PUBLICBASEURL: http://localhost:8080
        MDU_ASSETS_ALLOWHTTP: "true"
        MDU_ASSETS_ADMIN_USER: admin
        MDU_ASSETS_ADMIN_PASSWORD: smoke-test-password
        ASPNETCORE_HTTP_PORTS: 8080
      run: |
        mkdir "$RUNNER_TEMP/extracted"
        tar -xzf "$RUNNER_TEMP/$ARCHIVE_NAME.tar.gz" -C "$RUNNER_TEMP/extracted"
        "$RUNNER_TEMP/extracted/$ARCHIVE_NAME/mdu-assets" &
        pid=$!
        Source/smoke-test.sh http://127.0.0.1:8080 http://localhost:8080 admin smoke-test-password
        kill $pid

    - name: Upload archive
      uses: actions/upload-artifact@v7
      with:
        name: native-${{ matrix.rid }}
        path: ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}.tar.gz
        if-no-files-found: error

  docker-image:
    name: Docker image (${{ matrix.platform }})
    # Pushes the images by digest only, so they stay untagged until the GitHub release is published.
    needs: [prepare-release, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image for the smoke test
      uses: docker/build-push-action@v7
      with:
        context: Source
        platforms: ${{ matrix.platform }}
        build-args: VERSION=${{ needs.prepare-release.outputs.version }}
        tags: mdu-assets:release
        load: true

    - name: Smoke test the container
      run: |
        docker run --detach --name mdu-assets --publish 127.0.0.1:8080:8080 \
          --env MDU_ASSETS_UIBASEURL=http://127.0.0.1:8080 \
          --env MDU_ASSETS_PUBLICBASEURL=http://localhost:8080 \
          --env MDU_ASSETS_ALLOWHTTP=true \
          --env MDU_ASSETS_ADMIN_USER=admin \
          --env MDU_ASSETS_ADMIN_PASSWORD=smoke-test-password \
          mdu-assets:release
        Source/smoke-test.sh http://127.0.0.1:8080 http://localhost:8080 admin smoke-test-password
        test "$(docker inspect --format '{{.Config.User}}' mdu-assets)" = app
        docker rm --force mdu-assets

    - name: Push image by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: Source
        platforms: ${{ matrix.platform }}
        build-args: VERSION=${{ needs.prepare-release.outputs.version }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        labels: |
          org.opencontainers.image.title=MDU Asset Server
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Save image digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

    - name: Upload image digest
      uses: actions/upload-artifact@v7
      with:
        name: docker-digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/${{ matrix.arch }}
        if-no-files-found: error
        # Long enough for "Re-run failed jobs" after a failed release on a later day.
        retention-days: 7

  release:
    name: Create GitHub release
    needs: [prepare-release, build-native, docker-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download native archives
      uses: actions/download-artifact@v8
      with:
        pattern: native-*
        path: assets
        merge-multiple: true

    - name: Validate archives and write checksums
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
      run: |
        expected=(
          "mdu-assets-$VERSION-linux-x64.tar.gz"
          "mdu-assets-$VERSION-linux-arm64.tar.gz"
          "mdu-assets-$VERSION-osx-arm64.tar.gz"
        )
        for asset in "${expected[@]}"; do
          if [[ ! -f "assets/$asset" ]]; then
            echo "::error::Missing release asset: $asset"
            exit 1
          fi
        done
        actual_count=$(find assets -maxdepth 1 -type f | wc -l)
        if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
          echo "::error::Expected ${#expected[@]} archives, found $actual_count."
          exit 1
        fi
        (cd assets && sha256sum "${expected[@]}" > SHA256SUMS)

    - name: Download release notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes

    - name: Create or resume the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        NOTES: ${{ runner.temp }}/release-notes/release-notes.md
      run: |
        if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$NOTES"
        else
          # Use "Re-run failed jobs" after a partial release so the run reuses its calculated version.
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$NOTES" assets/*
        fi
        gh release edit "$RELEASE_TAG" --draft=false

  publish-docker:
    name: Publish Docker Hub tags
    needs: [prepare-release, docker-image, release]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Download image digests
      uses: actions/download-artifact@v8
      with:
        pattern: docker-digest-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - name: Create and push multi-architecture tags
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
      run: |
        docker buildx imagetools create \
          --tag "$IMAGE:$VERSION" \
          --tag "$IMAGE:latest" \
          "$IMAGE@$(cat "$RUNNER_TEMP/digests/amd64")" \
          "$IMAGE@$(cat "$RUNNER_TEMP/digests/arm64")"
        docker buildx imagetools inspect "$IMAGE:$VERSION"

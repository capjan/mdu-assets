name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; pushes to main each get their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pull request commits
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Check commit messages
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        invalid=$(git log --format=%s "$BASE_SHA..HEAD" | grep -Ev '^[[:lower:]][[:lower:][:digit:]-]*(\([^()]+\))?!?: [^[:space:]].*$' || true)
        if [ -n "$invalid" ]; then
          echo "::error::Commit messages must follow Conventional Commits: <type>[optional scope][!]: <description>"
          printf '%s\n' "$invalid"
          exit 1
        fi

  lint-docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install mdu
      run: dotnet tool install --global mdu

    - name: Lint Markdown
      run: mdu lint Docs

name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; pushes to main each get their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pull request commits
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Check commit messages
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        invalid=$(git log --format=%s "$BASE_SHA..HEAD" | grep -Ev '^[[:lower:]][[:lower:][:digit:]-]*(\([^()]+\))?!?: [^[:space:]].*$' || true)
        if [ -n "$invalid" ]; then
          echo "::error::Commit messages must follow Conventional Commits: <type>[optional scope][!]: <description>"
          printf '%s\n' "$invalid"
          exit 1
        fi

  lint-docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install mdu
      run: dotnet tool install --global mdu

    - name: Lint Markdown
      run: |
        mdu lint Docs
        mdu lint Spikes

  # Builds run only when these folders change.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code:
            - 'Source/**'
            - 'Spikes/**'
            - '.github/workflows/**'

  # Keeps the NetVips Native AOT spike green, so library updates that break AOT or AVIF show up early.
  netvips-aot-spike:
    name: NetVips AOT spike (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Spikes/NetVipsAot
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Spikes/NetVipsAot/global.json

    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      run: >-
        dotnet publish NetVipsAot.csproj --configuration Release --runtime ${{ matrix.rid }}
        -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/spike"

    - name: Run spike checks
      run: '"$RUNNER_TEMP/spike/NetVipsAot"'

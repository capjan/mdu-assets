name: Docs

# Renders Docs with MDU and checks the site on pull requests; pushes to main also publish it on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['Docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['Docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Render site
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history, so every page shows when it was last updated.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install mdu
      run: dotnet tool install --global mdu

    - name: Render site
      run: >-
        mdu render Docs site
        --editPageRoot "${{ github.server_url }}/${{ github.repository }}/edit/${{ github.event.repository.default_branch }}/Docs"

    - name: Check rendered site
      run: mdu check-site site

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5

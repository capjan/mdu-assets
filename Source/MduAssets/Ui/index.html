<!doctype html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MDU Assets</title>
    <link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/ui/tokens.css">
    <link rel="stylesheet" href="/ui/app.css">
    <script src="/ui/theme.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
    <a class="site-brand" href="/">
        <img class="site-brand-logo" src="/ui/icon.svg" alt="" width="30" height="30">
        <span>MDU Assets</span>
    </a>
    <div class="site-header-actions">
        <span class="user-name" id="user-name"></span>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button">
            <svg class="theme-icon-auto" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M10 1.5a8.5 8.5 0 0 1 0 17z"></path>
                <circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
            </svg>
            <svg class="theme-icon-light" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <circle cx="10" cy="10" r="3.5"></circle>
                <path d="M10 1.5v2M10 16.5v2M18.5 10h-2M3.5 10h-2M16 4l-1.4 1.4M5.4 14.6 4 16M16 16l-1.4-1.4M5.4 5.4 4 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
            </svg>
            <svg class="theme-icon-dark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M17.5 12.5A8 8 0 0 1 7.5 2.2 8.5 8.5 0 1 0 17.5 12.5Z"></path>
            </svg>
        </button>
    </div>
</header>
<div class="layout">
    <nav class="sidebar" aria-label="Projects">
        <p class="sidebar-label" id="projects-label">Projects</p>
        <ul class="project-list" id="project-list" aria-labelledby="projects-label"></ul>
    </nav>
    <main class="main" id="main" tabindex="-1">
        <h1 id="project-title">Images</h1>
        <p class="project-summary" id="project-summary"></p>

        <div class="toolbar">
            <button class="primary-button" id="upload-button" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 13.5V3.5M5.5 8 10 3.5 14.5 8M3.5 13.5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2"></path></svg>
                Upload images
            </button>
            <input class="file-input" id="file-input" type="file" multiple
                   accept="image/png,image/jpeg,image/gif,image/webp,image/avif,image/bmp,image/svg+xml,.svg" tabindex="-1" aria-hidden="true">
            <p class="toolbar-hint">or drop or paste images anywhere on this page</p>
            <div class="view-switch" role="group" aria-label="View">
                <button class="icon-button" id="view-grid" type="button" aria-pressed="true" aria-label="Grid" title="Grid">
                    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="3" y="3" width="5.5" height="5.5" rx="1.2"></rect><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.2"></rect><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.2"></rect><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.2"></rect></svg>
                </button>
                <button class="icon-button" id="view-list" type="button" aria-pressed="false" aria-label="List" title="List">
                    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7 5h10M7 10h10M7 15h10M3.5 5h.01M3.5 10h.01M3.5 15h.01"></path></svg>
                </button>
            </div>
        </div>

        <section class="snippets" id="snippets" aria-labelledby="snippets-heading" hidden>
            <div class="snippets-header">
                <h2 id="snippets-heading">Snippets</h2>
                <button class="secondary-button" id="copy-all" type="button" hidden>Copy all</button>
                <button class="secondary-button" id="clear-snippets" type="button">Clear</button>
            </div>
            <ol class="snippet-list" id="snippet-list"></ol>
        </section>

        <section class="assets" aria-labelledby="assets-heading">
            <h2 class="visually-hidden" id="assets-heading">All images</h2>
            <ul class="asset-grid" id="asset-grid"></ul>
            <div class="table-wrapper" id="asset-table-wrapper" hidden>
                <table class="asset-table" id="asset-table">
                    <thead>
                    <tr>
                        <th scope="col" aria-sort="none"><button type="button" data-sort="fileName">Name</button></th>
                        <th scope="col" aria-sort="none"><button type="button" data-sort="pixels">Dimensions</button></th>
                        <th scope="col" aria-sort="none"><button type="button" data-sort="size">Size</button></th>
                        <th scope="col" aria-sort="descending"><button type="button" data-sort="createdAt">Uploaded</button></th>
                    </tr>
                    </thead>
                    <tbody id="asset-rows"></tbody>
                </table>
            </div>
            <button class="secondary-button load-more" id="load-more" type="button" hidden>Show more images</button>
            <p class="empty-state" id="empty-state" hidden>No images yet. Drop, paste or upload one.</p>
        </section>
    </main>
</div>
<div class="drop-zone" id="drop-zone" hidden>
    <div class="drop-zone-panel">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 13.5V3.5M5.5 8 10 3.5 14.5 8M3.5 13.5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2"></path></svg>
        <span>Drop images to upload to <strong id="drop-target">Default</strong></span>
    </div>
</div>
<div class="visually-hidden" id="status" role="status" aria-live="polite"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
